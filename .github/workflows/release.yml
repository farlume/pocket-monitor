name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and tag
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('androidApp/build.gradle.kts').read_text()
          version = re.search(r'versionName = "([^"]+)"', text).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          if tag != 'v' + version:
              raise SystemExit('Tag does not match Android versionName')
          if not pathlib.Path('docs/releases', tag + '.md').is_file():
              raise SystemExit('Missing release notes for this tag')
          PY
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Install Android SDK packages
        run: '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"'
      - name: Run tests
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew --no-daemon :shared:jvmTest :androidApp:testDebugUnitTest
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 environment secret')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pocket-monitor-release.keystore'
          data = base64.b64decode(value, validate=True)
          with path.open('xb') as stream:
              os.chmod(path, 0o600)
              stream.write(data)
          PY
      - name: Build signed Release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pocket-monitor-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :androidApp:lintRelease :androidApp:assembleRelease :androidApp:bundleRelease
      - name: Verify signatures and package release material
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-release.apk > "$RUNNER_TEMP/apk-signature.txt"
          "$SDK_TOOLS/zipalign" -c -P 16 4 androidApp/build/outputs/apk/release/androidApp-release.apk
          jarsigner -verify androidApp/build/outputs/bundle/release/androidApp-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-signature.txt"
          python3 - <<'PY'
          import os, pathlib, re
          expected = os.environ['ANDROID_SIGNING_CERT_SHA256'].lower()
          report = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'apk-signature.txt').read_text()
          actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', report)
          if not expected or not actual or actual.group(1).lower() != expected:
              raise SystemExit('APK signing certificate does not match the release environment')
          PY
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export EXPECTED_TAG="$GITHUB_REF_NAME"
          fi
          python3 scripts/package_release.py
          cd artifacts/release
          sha256sum --check SHA256SUMS
      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checks-${{ github.run_id }}
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/tests/
            androidApp/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pocket-monitor-release.keystore').unlink(missing_ok=True)
          PY

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.run_id }}
          path: artifacts/release
      - name: Verify uploaded files
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/release/* \
            --verify-tag --draft \
            --title "Pocket Monitor $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
