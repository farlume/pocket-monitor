name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and translations
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Export offline documentation
        run: python3 scripts/package_docs.py
      - name: Upload offline documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-${{ github.run_id }}
          path: artifacts/documentation/*-docs.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK packages
        run: '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"'
      - name: Test, lint and build Debug
        run: ./gradlew --no-daemon :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ github.run_id }}
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/tests/
            androidApp/build/reports/lint-results-debug.*
            androidApp/build/reports/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ github.run_id }}
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
